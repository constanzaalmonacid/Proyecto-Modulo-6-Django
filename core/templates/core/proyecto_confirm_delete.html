{% extends 'core/base.html' %}
{% block content %}
<h1>Eliminar proyecto</h1>
<p>¿Seguro que deseas eliminar "{{ object.nombre }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'proyecto_list' %}">Cancelar</a>
</form>
{% endblock %}
